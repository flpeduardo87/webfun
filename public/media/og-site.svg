<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1e23"/>
      <stop offset="100%" stop-color="#18191d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Lime top bar -->
  <rect width="1200" height="6" fill="#c6f135"/>

  <!-- Decorative circles top-right -->
  <circle cx="980" cy="120" r="220" fill="none" stroke="rgba(198,241,53,0.06)" stroke-width="1"/>
  <circle cx="980" cy="120" r="160" fill="none" stroke="rgba(198,241,53,0.05)" stroke-width="1"/>
  <circle cx="980" cy="120" r="100" fill="none" stroke="rgba(198,241,53,0.07)" stroke-width="1"/>
  <circle cx="980" cy="120" r="46" fill="rgba(198,241,53,0.08)"/>

  <!-- webfun wordmark top-left -->
  <text x="72" y="84" font-family="'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#ffffff">webfun</text>
  <text x="72" y="106" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.38)" letter-spacing="0.5">web design &amp; tecnologia</text>

  <!-- Divider -->
  <line x1="72" y1="140" x2="680" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Headline -->
  <text x="72" y="260" font-family="'Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#ffffff">Site no ar em semanas.</text>
  <text x="72" y="350" font-family="'Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="-3" fill="#c6f135">Feito para converter.</text>

  <!-- Tag pill -->
  <rect x="72" y="420" width="238" height="40" rx="20" fill="rgba(198,241,53,0.12)" stroke="rgba(198,241,53,0.25)" stroke-width="1"/>
  <text x="191" y="445" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#c6f135" text-anchor="middle" letter-spacing="1">SITE INSTITUCIONAL</text>

  <!-- URL bottom-right -->
  <rect x="960" y="570" width="168" height="36" rx="18" fill="#c6f135"/>
  <text x="1044" y="593" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="800" fill="#1e2700" text-anchor="middle">webfun.com.br</text>
</svg>